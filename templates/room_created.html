<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Room Created | StreamMates</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='CSS/style.css') }}">

    <style>

        .created-container {

            min-height: 80vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

        }


        .created-card {

            width: 100%;

            max-width: 600px;

            padding: 45px;

            text-align: center;

            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: 20px;

            backdrop-filter: blur(15px);

            box-shadow:
                0 0 50px rgba(0, 0, 0, 0.3);

        }


        .success-icon {

            font-size: 60px;

            margin-bottom: 15px;

            animation: floatIcon 2.5s ease-in-out infinite;

        }


        @keyframes floatIcon {

            0%,
            100% {

                transform: translateY(0);

            }

            50% {

                transform: translateY(-8px);

            }

        }


        .created-card h1 {

            font-size: 30px;

            margin-bottom: 10px;

        }


        .created-card p {

            color: var(--muted);

            line-height: 1.6;

            font-size: 14px;

        }


        .room-name {

            margin: 25px 0 15px;

            padding: 14px;

            border: 1px solid var(--border);

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.03);

            font-weight: bold;

        }


        .code-label {

            margin-top: 25px;

            color: var(--muted);

            font-size: 11px;

            letter-spacing: 2px;

        }


        .room-code {

            margin: 10px 0 25px;

            padding: 18px;

            border-radius: 12px;

            background: rgba(0, 255, 255, 0.05);

            border: 1px solid rgba(0, 255, 255, 0.25);

            color: var(--cyan);

            font-size: 32px;

            font-weight: bold;

            letter-spacing: 8px;

        }


        .share-text {

            color: var(--muted);

            font-size: 12px;

            margin-bottom: 25px;

        }


        .enter-btn {

            display: block;

            width: 100%;

            box-sizing: border-box;

            padding: 15px 20px;

            border-radius: 10px;

            background: var(--cyan);

            color: #000;

            text-decoration: none;

            font-size: 14px;

            font-weight: bold;

            transition: 0.3s;

        }


        .enter-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 0 25px rgba(0, 255, 255, 0.3);

        }


        .copy-btn {

            margin-top: 12px;

            width: 100%;

            padding: 13px;

            border-radius: 10px;

            border: 1px solid var(--border);

            background: rgba(255, 255, 255, 0.03);

            color: var(--muted);

            cursor: pointer;

            font-weight: bold;

            transition: 0.3s;

        }


        .copy-btn:hover {

            background: rgba(255, 255, 255, 0.07);

            color: white;

        }


        @media (max-width: 600px) {

            .created-container {

                padding: 20px;

            }

            .created-card {

                padding: 30px 22px;

            }

            .room-code {

                font-size: 25px;

                letter-spacing: 5px;

            }

        }

    </style>

</head>


<body>


    <!-- BACKGROUND -->

    <div class="background">

        <div class="orb orb-1"></div>

        <div class="orb orb-2"></div>

        <div class="orb orb-3"></div>

    </div>


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">

            <span class="logo-icon">▶</span>

            WATCH<span>//</span>PARTY

        </div>


        <div class="nav-right">

            <button id="themeToggle">

                ☀

            </button>

        </div>

    </header>


    <!-- MAIN -->

    <main class="created-container">


        <div class="created-card">


            <div class="success-icon">

                🎉

            </div>


            <h1>

                Room Created!

            </h1>


            <p>

                Your watch party is ready.
                Share the room code with your friends
                so they can join.

            </p>


            <div class="room-name">

                🎬 {{ room["room_name"] }}

            </div>


            <div class="code-label">

                YOUR ROOM CODE

            </div>


            <div
                class="room-code"
                id="roomCode"
            >

                {{ room["room_code"] }}

            </div>


            <div class="share-text">

                Friends can use this code to join
                your watch party.

            </div>


            <a
                href="{{ url_for(
                    'watch_room',
                    room_code=room['room_code'],
                    player_id=player_id
                ) }}"
                class="enter-btn"
            >

                ENTER WATCH PARTY →

            </a>


            <button
                type="button"
                class="copy-btn"
                onclick="copyRoomCode()"
            >

                📋 COPY ROOM CODE

            </button>


        </div>


    </main>


    <script>

        function copyRoomCode() {

            const code =
                document.getElementById(
                    "roomCode"
                ).innerText.trim();


            navigator.clipboard.writeText(
                code
            );


            const button =
                document.querySelector(
                    ".copy-btn"
                );


            button.innerText =
                "✓ COPIED!";


            setTimeout(
                function() {

                    button.innerText =
                        "📋 COPY ROOM CODE";

                },
                1500
            );

        }

    </script>


    <script
        src="{{ url_for('static', filename='js/main.js') }}"
    ></script>


</body>

</html>
