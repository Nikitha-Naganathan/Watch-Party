<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leave Room | Watch//Party</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .quit-container {

            min-height: calc(100vh - 80px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

        }

        .quit-card {

            width: min(600px, 100%);

            padding: 45px;

            text-align: center;

            border: 1px solid var(--border);

            border-radius: 20px;

            background: var(--surface);

            backdrop-filter: blur(20px);

            box-shadow:
                0 0 50px rgba(236, 72, 153, 0.12);

        }

        .warning-icon {

            font-size: 60px;

            margin-bottom: 20px;

        }

        .quit-card h1 {

            font-size: 36px;

            letter-spacing: -1px;

            margin-bottom: 15px;

        }

        .quit-card p {

            color: var(--muted);

            line-height: 1.6;

            margin-bottom: 30px;

        }

        .room-name {

            color: var(--cyan);

            font-weight: bold;

            margin-bottom: 30px;

        }

        .quit-options {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;

        }

        .delete-btn,
        .leave-btn,
        .cancel-btn {

            padding: 15px;

            border-radius: 10px;

            font-weight: bold;

            cursor: pointer;

            font-size: 14px;

            transition: 0.3s;

        }

        .delete-btn {

            border: 1px solid rgba(239, 68, 68, 0.5);

            background: rgba(239, 68, 68, 0.1);

            color: #f87171;

        }

        .delete-btn:hover {

            background: rgba(239, 68, 68, 0.2);

            box-shadow:
                0 0 20px rgba(239, 68, 68, 0.2);

        }

        .leave-btn {

            border: none;

            background: linear-gradient(90deg,
                    var(--purple),
                    var(--pink));

            color: white;

        }

        .leave-btn:hover {

            transform: translateY(-3px);

            box-shadow:
                0 0 25px rgba(236, 72, 153, 0.35);

        }

        .cancel-btn {

            width: 100%;

            margin-top: 15px;

            border: 1px solid var(--border);

            background: transparent;

            color: var(--text);

        }

        .cancel-btn:hover {

            border-color: var(--cyan);

        }

        @media (max-width: 600px) {

            .quit-options {

                grid-template-columns: 1fr;

            }

        }
    </style>

</head>


<body>

    <div class="background">

        <div class="orb orb-1"></div>

        <div class="orb orb-2"></div>

        <div class="orb orb-3"></div>

    </div>


    <header class="navbar">

        <div class="logo">

            <span class="logo-icon">▶</span>

            WATCH<span>//</span>PARTY

        </div>

    </header>


    <main class="quit-container">

        <div class="quit-card">

            <div class="warning-icon">
                👑
            </div>

            <h1>
                Leaving the Party?
            </h1>

            <p>

                You are the host of this watch party.

                <br>

                What would you like to do with the room?

            </p>


            <div class="room-name">

                🎬 {{ room["room_name"] }}

            </div>


            <div class="quit-options">

                <form method="POST" action="{{ url_for('delete_room', room_code=room['room_code']) }}">

                    <button type="submit" class="delete-btn">

                        🗑️ DELETE ROOM

                    </button>

                </form>


                <form method="POST" action="{{ url_for('leave_room', room_code=room['room_code']) }}">

                    <button type="submit" class="leave-btn">

                        🚪 LEAVE ROOM

                    </button>

                </form>

            </div>


            <a href="{{ url_for('watch_room', room_code=room['room_code']) }}" class="cancel-btn"
                style="display:block; text-decoration:none;">

                CANCEL

            </a>

        </div>

    </main>

</body>

</html>
