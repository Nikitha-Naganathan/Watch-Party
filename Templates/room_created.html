<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Room Created | Watch//Party</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .success-container {
            min-height: calc(100vh - 80px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        .success-card {
            width: min(600px, 100%);

            padding: 50px 40px;

            text-align: center;

            border: 1px solid var(--border);

            border-radius: 25px;

            background: var(--surface);

            backdrop-filter: blur(20px);

            box-shadow:
                0 0 50px rgba(168, 85, 247, 0.15);
        }

        .success-icon {
            font-size: 60px;

            animation: successFloat 3s ease-in-out infinite;
        }

        @keyframes successFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }

        }

        .success-card h1 {
            font-size: 42px;

            letter-spacing: -1px;

            margin: 20px 0 10px;
        }

        .success-card>p {
            color: var(--muted);

            margin-bottom: 30px;
        }

        .room-name {
            font-size: 22px;

            font-weight: bold;

            margin-bottom: 30px;
        }

        .code-label {
            color: var(--muted);

            font-size: 12px;

            letter-spacing: 3px;

            margin-bottom: 10px;
        }

        .room-code {
            font-size: 48px;

            font-weight: 900;

            letter-spacing: 8px;

            color: var(--cyan);

            padding: 20px;

            border: 1px dashed var(--cyan);

            border-radius: 15px;

            background: rgba(34, 211, 238, 0.05);

            text-shadow:
                0 0 20px rgba(34, 211, 238, 0.6);
        }

        .copy-btn {
            margin-top: 15px;

            padding: 12px 20px;

            border: 1px solid var(--border);

            border-radius: 8px;

            background: var(--surface);

            color: var(--text);

            cursor: pointer;

            transition: 0.3s;
        }

        .copy-btn:hover {
            border-color: var(--cyan);

            box-shadow:
                0 0 15px rgba(34, 211, 238, 0.2);
        }

        .room-details {
            display: flex;

            justify-content: center;

            gap: 20px;

            margin-top: 30px;

            flex-wrap: wrap;
        }

        .detail {
            padding: 10px 15px;

            border: 1px solid var(--border);

            border-radius: 8px;

            color: var(--muted);

            font-size: 13px;
        }

        .enter-btn {
            display: block;

            margin-top: 35px;

            padding: 16px;

            border-radius: 10px;

            background: linear-gradient(90deg,
                    var(--purple),
                    var(--pink));

            color: white;

            text-decoration: none;

            font-weight: bold;

            transition: 0.3s;
        }

        .enter-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 0 30px rgba(236, 72, 153, 0.4);
        }
    </style>

</head>


<body>

    <div class="background">

        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>

    </div>


    <header class="navbar">

        <div class="logo">
            <span class="logo-icon">▶</span>
            WATCH<span>//</span>PARTY
        </div>

        <div class="nav-right">

            <button id="themeToggle">
                ☀
            </button>

        </div>

    </header>


    <main class="success-container">

        <div class="success-card">

            <div class="success-icon">
                🎉
            </div>

            <h1>
                Room Created!
            </h1>

            <p>
                Your watch party is ready.
            </p>

            <div class="room-name">
                {{ room["room_name"] }}
            </div>


            <div class="code-label">
                SHARE THIS ROOM CODE
            </div>

            <div class="room-code" id="roomCode">
                {{ room["room_code"] }}
            </div>


            <button class="copy-btn" onclick="copyRoomCode()">
                📋 COPY CODE
            </button>


            <div class="room-details">

                <div class="detail">
                    {% if room["room_type"] == "public" %}
                    🌐 Public
                    {% else %}
                    🔒 Private
                    {% endif %}
                </div>

                <div class="detail">
                    👥 {{ room["max_players"] }} Players
                </div>

                <div class="detail">
                    🎨 {{ room["theme"]|capitalize }}
                </div>

            </div>


            <a
                href="{{ url_for('watch_room', room_code=room['room_code']) }}"
                class="enter-btn"
            >
                ENTER WATCH PARTY →
            </a>

        </div>

    </main>


    <script>

        function copyRoomCode() {

            const code =
                document.getElementById("roomCode").innerText;

            navigator.clipboard.writeText(code);

            const button =
                document.querySelector(".copy-btn");

            button.innerText = "✓ COPIED!";

            setTimeout(() => {

                button.innerText = "📋 COPY CODE";

            }, 2000);

        }

    </script>


    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>

</html>
